name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject Deploy Info
        run: |
          COMMIT_HASH=$(git rev-parse --short HEAD)
          DEPLOY_DATE=$(date -u +"%Y-%m-%d")
          REPLACE_STR="Deployed: ${DEPLOY_DATE} (SHA: ${COMMIT_HASH})"
          echo "Attempting to replace placeholder with: $REPLACE_STR"
          
          if grep -q "__DEPLOY_INFO__" index.html; then
            echo "Placeholder found in index.html. Replacing..."
            sed -i "s|__DEPLOY_INFO__|${REPLACE_STR}|g" index.html
          else
            echo "ERROR: Placeholder __DEPLOY_INFO__ NOT found in index.html!"
          fi
          
          echo "----- Verification (last 10 lines of index.html) -----"
          tail -n 10 index.html
          echo "-----------------------------------------------------"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4