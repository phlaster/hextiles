name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Inject Deploy Info
        run: |
          node -e "
          const fs = require('fs');
          const commit = process.env.GITHUB_SHA.substring(0, 7);
          const date = new Date().toISOString().split('T')[0];
          const str = 'Deployed: ' + date + ' (SHA: ' + commit + ')';
          let html = fs.readFileSync('index.html', 'utf8');
          html = html.replace('__DEPLOY_INFO__', str);
          fs.writeFileSync('index.html', html);
          console.log('Injected: ' + str);
          console.log('Verification:', fs.readFileSync('index.html', 'utf8').includes(str));
          "

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4